spring:
  application:
    name: thuliinai-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5

  flyway:
    url: ${FLYWAY_URL}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  main:
    lazy-initialization: true

server:
  port: ${PORT:8080}

r2:
  access-key: ${R2_ACCESS_KEY}
  secret-key: ${R2_SECRET_KEY}
  endpoint: ${R2_ENDPOINT}
  bucket: ${R2_BUCKET}

jwt:
  # Base64-encoded 256-bit HMAC-SHA256 secret — set this in the environment/secrets vault.
  secret: ${JWT_SECRET}
  # Token validity in milliseconds: default 24 hours (86_400_000 ms).
  expiry-ms: ${JWT_EXPIRY_MS:86400000}
